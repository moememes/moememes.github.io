<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Color every California county by whether you passed through, alighted, visited, stayed, or lived there."
    />
    <meta name="theme-color" content="#9fc4f8" />
    <title>California County Level Map</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%BA%EF%B8%8F%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./app.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section id="shareBoard" class="map-board" aria-label="Interactive square California county map">
        <svg
          id="countyMap"
          class="california-map"
          viewBox="18 60 510 615"
          role="group"
          aria-label="Interactive map of California counties"
        >
          <g id="countyShapes" class="county-shapes"></g>
          <g id="countyLabels" class="county-labels" aria-hidden="true"></g>
        </svg>

        <section class="map-legend" aria-labelledby="legendTitle">
          <div class="legend-heading">
            <div>
              <p class="eyebrow">Color key</p>
              <h2 id="legendTitle">Journey levels</h2>
            </div>
            <span>0–5</span>
          </div>
          <ol id="legendList" class="legend-list"></ol>
        </section>

        <header class="map-title">
          <p>My California map</p>
          <h1>CA <span>Level <strong id="score">0</strong></span></h1>
          <div><strong><span id="coloredCount">0</span> / 58</strong> counties colored</div>
        </header>

        <div id="countyPicker" class="county-picker is-hidden" aria-label="Choose county level">
          <div class="picker-heading">
            <strong id="pickerCountyName">County</strong>
            <button id="closePicker" type="button" aria-label="Close county menu">×</button>
          </div>
          <label for="levelSelect">Travel level</label>
          <select id="levelSelect">
            <option value="" disabled>Choose a level…</option>
          </select>
        </div>
      </section>

      <div class="map-actions" aria-label="Map actions">
        <p><strong>Click a county</strong>, then choose its level from the dropdown.</p>
        <div>
          <span id="saveStatus">Loading your map…</span>
          <button id="downloadMap" type="button">Download square PNG</button>
          <button id="resetMap" type="button" disabled>Reset</button>
        </div>
      </div>
    </main>
  </body>
</html>
